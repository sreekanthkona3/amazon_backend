version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci
    build:
      commands:
        - mkdir -p.amplify-hosting/compute/default
        - cp server.js package.json.amplify-hosting/compute/default/
        - cp -r node_modules.amplify-hosting/compute/default/ 2>/dev/null || true
        - node -e "require('fs').writeFileSync('.amplify-hosting/deploy-manifest.json', JSON.stringify({version:1,framework:{name:'express',version:'5.2.1'},routes:[{path:'/*',target:{kind:'Compute',src:'default'}}],computeResources:[{name:'default',runtime:'nodejs20.x',entrypoint:'server.js'}]}))"
  artifacts:
    baseDirectory:.amplify-hosting
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
